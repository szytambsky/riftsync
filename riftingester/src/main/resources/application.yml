spring:
  application:
    name: riftingester
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/riftingester}
    username: ${DATABASE_USERNAME:riftingester}
    password: ${DATABASE_PASSWORD:riftingester}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ingester:
  openrift:
    base-url: https://openrift.app
    user-agent: Riftingester/0.1 (contact@example.com)
    connect-timeout: 15s
  sync:
    cron: "0 0 5 * * *"
    scheduler-enabled: true
